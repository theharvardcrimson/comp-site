# ==========================================================
#  SEMESTER SETTINGS
#  Update this file at the start of every comp cycle.
#  After saving, RESTART the dev server -- livereload does
#  not pick up changes to _data files.
# ==========================================================

# Shows as "Fall Comp 2026" in the header and page titles.
season: Fall
year: 2026

# The "Sign up" button, used everywhere on the site.
signup_url: https://docs.google.com/forms/d/e/1FAIpQLScnz4wmdtXud61rA9Zlm6n5JMqopGssM4RDw2PDQoXOsNWyXg/viewform

# Who to email with questions. Shown in the footer and on every board page.
contact_name: E. Matteo Diaz
contact_title: Crimson President
contact_email: president@thecrimson.com

# Where we are.
address: 14 Plympton St

# The big line in the footer. PLACEHOLDER -- Claude wrote this one, so replace
# it with your own words whenever you like. Two short lines work best; a long
# line wraps oddly because it is set large.
footer_line: Ten boards. One newsroom.

# The paper itself, linked from the footer so readers can go read it.
paper_url: https://www.thecrimson.com


# ---- Comp events ----
# Shown as a compact list just above the ten boards.
#
# Only `name` is required. Fill in `when` and `where` as they get confirmed --
# an event with no date still tells someone it is happening. Delete an entry to
# remove it; empty the whole list and the section disappears from the page.
#
#   when:  free text, e.g. "Sat. Sept. 6, 4-6 p.m."
#   where: free text, e.g. "14 Plympton St"

events:
  - name: Harvard College Club Fair
    when: ""
    where: ""
  - name: Comp Open House / Kickoff
    when: ""
    where: ""
  - name: Comp Mixer
    when: ""
    where: ""


# ---- The three numbers in the stat strip. ----
# Set any value to "" to hide that stat.

stat_1_number: 153
stat_1_label: years in print

stat_2_number: 21M
stat_2_label: readers a year

stat_3_number: 10
stat_3_label: boards to join


# ---- One-line note above the board list. ----
# Set to "" to hide it entirely.
# Currently used for the shared reporting comp, which is the thing most
# likely to stop someone worrying they have to pick correctly up front.
before_you_choose: News, Magazine, Sports and Arts comp together for the first three weeks before splitting off. You don't have to decide yet.
