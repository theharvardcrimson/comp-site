# ==========================================================
#  SEMESTER SETTINGS
#  Update this file at the start of every comp cycle.
#  After saving, RESTART the dev server -- livereload does
#  not pick up changes to _data files.
# ==========================================================

# Shows as "Fall Comp 2026" in the header and page titles.
season: Fall
year: 2026

# The "Sign up" button, used everywhere on the site.
# The words on the buttons pointing at signup_url. TWO values, on purpose.
#
# signup_label is the full wording, used everywhere the button has room: the
# hero, the drawer, the footer, and the foot of every board page.
#
# header_signup_label is the sticky top bar only, where the bar is 390px wide on
# a phone and shares it with the menu toggle. "Interest form" is nearly twice
# the width of "Sign up" and made that corner top-heavy, so the bar gets the
# short wording. Leave header_signup_label empty and the bar falls back to
# signup_label.
signup_label: Interest form
header_signup_label: Sign up

signup_url: https://docs.google.com/forms/d/e/1FAIpQLScnz4wmdtXud61rA9Zlm6n5JMqopGssM4RDw2PDQoXOsNWyXg/viewform

# Who to email with questions. Shown in the footer and on every board page.
contact_name: E. Matteo Diaz
contact_title: Crimson President
contact_email: president@thecrimson.com

# Where we are.
address: 14 Plympton St

# The line above the big headline. Set to "" to hide it.
#
# This used to read "Fall 2026 - Sign-ups open", which was administrative
# metadata in the most valuable line on the page. The season and year are
# already in the header, and the Sign up button says sign-ups are open, so
# nothing is lost by using this space for something that argues.
#
# Keep it short -- one line on a phone is about 28 characters.
hero_tagline: ""

# Photo behind the homepage hero. A filename in images/, or "" for plain
# crimson. A crimson scrim sits over it at 88% so the headline stays legible
# no matter how bright the photograph is -- see the note in css/main.css.
# 14 Plympton straight on, from images/crimson-large.jpg. Resized to 1600px,
# 280KB. It ships in COLOUR and is desaturated to 45% in CSS instead -- full
# greyscale was tried and read as flat and lifeless. See css/main.css.
hero_photo: hero.jpg

# Credit and caption for the hero photograph. The credit line only appears if
# hero_photo_credit is filled in -- a photograph should not ship uncredited.
hero_photo_caption: ""
hero_photo_credit: ""

# The 1873 seal. A filename in images/, or "" to hide it everywhere.
# images/logo-mark.png is a 480px web version of the supplied artwork -- the
# original was 22800x22800 and 18MB, which cannot ship.
logo: logo-mark.png

# The big line in the footer. PLACEHOLDER -- Claude wrote this one, so replace
# it with your own words whenever you like. Two short lines work best; a long
# line wraps oddly because it is set large.
footer_line: Ten boards. One newsroom.

# The paper itself, linked from the footer so readers can go read it.
paper_url: https://www.thecrimson.com


# ---- Photo skeleton ----
# Set to false before launch and every placeholder box disappears. While true,
# each empty photo slot shows a labelled outline so the layout is visible and
# final before the real photographs exist. Dropping a photo in changes nothing
# structurally -- the slot is already the right shape.
show_photo_placeholders: true

# The three-up photo band on the homepage. `label` is what the placeholder box
# says; `photo` is the filename once you have one. Delete an entry to drop a
# slot, empty the list to remove the band.
# Three-up photo band. `label` is the image's ALT TEXT, so it must describe
# what is actually in the photograph -- it is not a headline and not a slogan.
# It also becomes the visible caption, but only when `credit` is filled in;
# with `credit` empty nothing is printed on the page.
#
# CREDITS ARE STILL MISSING for all three. The design has a byline slot and it
# stays hidden until a photographer's name is here. Fill `credit` and the
# caption appears automatically.
#
# The alt text below was written from looking at each photograph and is the
# owner's to correct -- particularly the event names, which were inferred from
# the filenames rather than known.
#
# Order is deliberate: archival black-and-white first as the anchor, then the
# bright modern room, then the dark press-room colour frame. That alternates
# tone rather than putting the two dark frames side by side.
photo_band:
  - label: Crimson editors crowded around a bottle of champagne in the press room, December 1966
    photo: photos/press-room-1966.jpg
    credit: ""
  - label: A phone on a tripod livestreaming a Harvard Undergraduate Association event
    photo: photos/hua-livestream.jpg
    credit: ""
  - label: An editor holding up a stack of freshly printed Commencement issues in the newsroom
    photo: photos/commencement-issues.jpg
    credit: ""


# Front pages that wipe across the homepage as you scroll. Same shape as
# photo_band. Six slots so the strip is wide enough to move; delete entries or
# empty the list to remove the band.
# `label` is documentation only once `photo` is set -- it renders solely for an
# empty slot, as the placeholder's caption. The band itself is aria-hidden
# decoration, so the images carry alt="" by design and need no credit line.
# Order here is the order they travel past. Add or remove entries freely.
press_strip:
# Vol. CLIII front pages, in date order -- oldest first, so the band reads
# forward in time as it travels. Sorting the filenames sorts the dates: they
# are ISO-prefixed for exactly that reason. Keep that convention for new ones.
#
# `photo` is a bare filename. The template builds two URLs from it,
# /images/covers/156/ and /images/covers/292/, and serves whichever fits --
# a phone fetches the 156px file, not the desktop one. Both derivatives must
# exist for every entry here.
#
# `label` is documentation only: it renders solely as an empty slot's caption,
# and no slot is empty now. The band is aria-hidden decoration, so the images
# carry alt="" by design and need no credit line.
  - label: Dec. 19, 2025
    photo: 2025-12-19_vol-cliii-no-01.jpg
  - label: Jan. 30, 2026
    photo: 2026-01-30_vol-cliii-no-02.jpg
  - label: Feb. 6, 2026
    photo: 2026-02-06_vol-cliii-no-03.jpg
  - label: Feb. 13, 2026
    photo: 2026-02-13_vol-cliii-no-04.jpg
  - label: Feb. 20, 2026
    photo: 2026-02-20_vol-cliii-no-05.jpg
  - label: Feb. 27, 2026
    photo: 2026-02-27_vol-cliii-no-06.jpg
  - label: March 6, 2026
    photo: 2026-03-06_vol-cliii-no-07.jpg
  - label: March 27, 2026
    photo: 2026-03-27_vol-cliii-no-08.jpg
  - label: April 3, 2026
    photo: 2026-04-03_vol-cliii-no-09.jpg
  - label: April 10, 2026
    photo: 2026-04-10_vol-cliii-no-10.jpg
  - label: April 17, 2026
    photo: 2026-04-17_vol-cliii-no-11.jpg
  - label: April 24, 2026
    photo: 2026-04-24_vol-cliii-no-12.jpg
  - label: April 26, 2026 · Visitas
