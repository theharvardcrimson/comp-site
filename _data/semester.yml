# ---- Homepage video ----
# The YouTube id only, not a full URL -- the template builds the embed and the
# thumbnail from it. This is the video that was on the old comp homepage.
# Empty the id and the whole video column disappears; the prose then runs full
# width on its own.
#
# `video_title` is the link's accessible name, so it must say what the video
# is. Taken from the title burned into the video's own opening frame, not
# invented -- correct it if the official title differs.
video_id: MGrF5ZJE7Yw
video_title: Keep the Old Sheet Flying

# ---- Comp events ----
# Shown as a compact list just above the ten boards.
#
# Only `name` is required. Fill in `when` and `where` as they get confirmed --
# an event with no date still tells someone it is happening. Delete an entry to
# remove it; empty the whole list and the section disappears from the page.
#
#   when:  free text, e.g. "Sat. Sept. 6, 4-6 p.m."
#   where: free text, e.g. "14 Plympton St"

events:
  - name: Harvard College Club Fair
    when: ""
    where: ""
  - name: Comp Open House / Kickoff
    when: ""
    where: ""
  - name: Comp Mixer
    when: ""
    where: ""


# ---- The three numbers in the stat strip. ----
# Set any value to "" to hide that stat.

stat_1_number: 153
stat_1_label: years

stat_2_number: 10
stat_2_label: boards

# stat_N_unit is an optional suffix (M, K) set smaller than the figure.
#
# The owner's words were "15+ million views in the last year". Split as 15 / M+
# so it renders "15M+", which is the conventional order; writing it "15+M" is a
# one-character change here if you prefer it literally. Note this also changes
# the metric from readers to VIEWS, which is what was actually said.
stat_3_number: 15
stat_3_unit: M+
stat_3_label: views last year

# Renders as "$1M ANNUAL REVENUE". This is the longest of the four labels, and
# with four stats across it is the one that will wrap first if the figures ever
# get bigger or the label longer -- checked to 320px as it stands.
stat_4_number: $1
stat_4_unit: M
stat_4_label: annual revenue


# ---- One-line note above the board list. ----
# Set to "" to hide it entirely.
# Currently used for the shared reporting comp, which is the thing most
# likely to stop someone worrying they have to pick correctly up front.
before_you_choose: News, Magazine, Sports and Arts comp together for the first three weeks before splitting off. You don't have to decide yet.
