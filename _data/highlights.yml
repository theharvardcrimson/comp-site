# Two columns under the intro on the homepage.
#
# HOW TO EDIT: each column has a `title`, an optional `teaser` line above the
# bullets, a list of `items`, and an optional `note` printed under the bullets.
# Type over any line. Delete an item to drop the bullet; delete a whole column
# to leave a single-column section; empty this file and the section disappears
# from the page.
#
# The financial-aid note below reads "Contact Crimson President E. Matteo Diaz
# at president@thecrimson.com" in the owner's draft, and show_contact is still
# what appends the name and mailto link. If either ever needs to differ from what
# is written here, edit semester.yml, not this file.

columns:
  - title: Our alumni
    teaser: For over 150 years, The Crimson has trained the nation’s brightest journalists, public servants, and business leaders
    items:
      - U.S. Presidents Franklin D. Roosevelt ’1904 and John F. Kennedy ’40
      - 70+ Pulitzer prize-winners, including Nicholas D. Kristof ’81, Linda Greenhouse ’68, David Sanger ’82, and Susan C. Faludi ’81
      - Titans of business, media, and technology, such as fmr. Microsoft CEO Steve Ballmer ’77, fmr. YouTube CEO Susan D. Wojcicki ’90, and Mad Money host Jim Cramer ’77
    note: ""
    show_contact: false

  - title: Financial aid
    teaser: We’re committed to making sure every Harvard student can join The Crimson, regardless of financial circumstance
    items:
      - Worried you’ll need a term-time job instead of The Crimson? You don’t have to choose
      - We offer limited but substantial compensation to staff members with demonstrated financial need
      - More than $1 million disbursed to Crimson editors over the last decade
    # `show_contact: true` appends the president's name and a mailto link from
    # semester.yml, so the address is not typed twice. "Questions?" is the whole
    # note now; the rest of the sentence is generated.
    note: <strong>Questions?</strong> Contact Crimson President
    show_contact: true
