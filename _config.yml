permalink: pretty

# Use kramdown's own parser, not GitHub-Flavored Markdown.
#
# Two reasons, both deliberate:
#  1. GFM needs the kramdown-parser-gfm gem. Plain kramdown ships with Jekyll,
#     so this keeps the dependency count at zero.
#  2. GFM turns a single newline into a <br>. That means hard-wrapping a
#     paragraph in your editor would silently inject line breaks into the page.
#     Plain kramdown treats a wrapped paragraph as one paragraph, so content
#     files can be wrapped for readability without changing the output.
markdown: kramdown
kramdown:
  input: kramdown

# The ten board pages. One file per board in _boards/, each served at /<name>/
# so every URL the old site published still resolves.
collections:
  boards:
    output: true
    permalink: /:name/

  # Prose blocks rendered into the homepage, one file per section, ordered by
  # the `order` field. output:false because these are not pages of their own --
  # they have no URL and exist only as blocks on the homepage.
  sections:
    output: false

# Every file in _boards/ uses the same layout, so no board page can drift
# structurally from the others. That drift is why the old ten pages ranged
# from 1435 to 2729px tall with no shared shape.
defaults:
  - scope:
      path: ""
      type: boards
    values:
      layout: board

# Files kept out of the built site. Jekyll's own defaults (Gemfile, vendor/,
# node_modules) are repeated here on purpose: setting `exclude` REPLACES the
# default list rather than adding to it, so omitting them would start
# publishing them.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - CLAUDE.md            # internal notes for agents; not site content
  - README.md            # setup instructions for maintainers
  - content-questions.md # working checklist, deleted once answered

  # Source artwork. .gitignore keeps these out of git but NOT out of the build
  # -- Jekyll copies anything it isn't told to skip, so the 18MB original was
  # being published until this line existed. Web versions live alongside as
  # images/logo-mark.png.
  - images/final_logo.jpeg
  - images/Logo_vector (2).ai

  # Legacy assets from the pre-redesign site. Verified unreferenced by any
  # template, stylesheet, data file or content file. They stay in the repo
  # rather than being deleted -- excluding them keeps them out of the build
  # without throwing anything away, and they can go properly later.
  - images/crimson.jpg        # superseded by the optimised images/hero.jpg
  - images/crimson-large.jpg  # source for hero.jpg; 724KB
  - images/harvard.jpg
  - images/header-logo.png
  - images/logo.svg           # old splash screen
  - images/external.png       # old navbar external-link icon
  - images/logo.png           # was the 714KB favicon

  # Dead font formats. .eot is IE-only and SVG fonts are obsolete; every
  # browser since ~2012 takes .woff, which is what main.css asks for.
  - fonts/*.eot
  - fonts/*.svg
  - fonts/*.ttf

  # Font families the redesign does not use. main.css loads exactly five
  # files: League Gothic, Crimson Roman + Bold, Vollkorn Regular + Italic.
  - fonts/Chunkfive-webfont.woff
  - fonts/ColabBol-webfont.woff
  - fonts/ColabLig-webfont.woff
  - fonts/ColabReg-webfont.woff
  - fonts/ColabThi-webfont.woff
  - fonts/Melbourne_reg.woff
  - fonts/gil_____-webfont.woff
  - fonts/gilb____-webfont.woff
  - fonts/gillsans-webfont.woff

