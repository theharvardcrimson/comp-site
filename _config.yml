permalink: pretty

# Use kramdown's own parser, not GitHub-Flavored Markdown.
#
# Two reasons, both deliberate:
#  1. GFM needs the kramdown-parser-gfm gem. Plain kramdown ships with Jekyll,
#     so this keeps the dependency count at zero.
#  2. GFM turns a single newline into a <br>. That means hard-wrapping a
#     paragraph in your editor would silently inject line breaks into the page.
#     Plain kramdown treats a wrapped paragraph as one paragraph, so content
#     files can be wrapped for readability without changing the output.
markdown: kramdown
kramdown:
  input: kramdown

# The ten boards. One file per board in _boards/. output:false -- the owner
# cut the standalone /<name>/ pages entirely, so these exist only as data for
# the homepage popup cards (_includes/board-panel.html) and are never written
# out as pages of their own. Same shape as the `sections` collection below,
# for the same reason.
collections:
  boards:
    output: false

  # Prose blocks rendered into the homepage, one file per section, ordered by
  # the `order` field. output:false because these are not pages of their own --
  # they have no URL and exist only as blocks on the homepage.
  sections:
    output: false

# Files kept out of the built site. Jekyll's own defaults (Gemfile, vendor/,
# node_modules) are repeated here on purpose: setting `exclude` REPLACES the
# default list rather than adding to it, so omitting them would start
# publishing them.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - CLAUDE.md            # internal notes for agents; not site content
  - README.md            # setup instructions for maintainers

  # PHOTO MASTERS. images/gallery/ holds the originals as supplied -- 6000x4000
  # frames and full-size cover scans, 60MB+ and growing. Without this line
  # Jekyll copies every one of them into _site: the built site measured 168MB,
  # of which 167MB was this directory. Optimised web versions live OUTSIDE
  # gallery/ (images/covers/, images/hero.jpg) precisely so this whole tree can
  # be excluded in one line. Put new masters in gallery/, never beside them.
  - images/gallery

  # Source artwork. .gitignore keeps these out of git but NOT out of the build
  # -- Jekyll copies anything it isn't told to skip, so the 18MB original was
  # being published until this line existed. Web versions live alongside as
  # images/logo-mark.png. (Logo_vector (2).ai, new_hero.jpeg, and
  # new_new_hero.jpg -- three earlier entries here -- have since been deleted
  # from images/ entirely, so their exclude lines were removed along with
  # them rather than left pointing at nothing.)
  - images/final_logo.jpeg

  # The seven pre-redesign legacy assets that used to be excluded here
  # (crimson.jpg, crimson-large.jpg, harvard.jpg, header-logo.png, logo.svg,
  # external.png, logo.png) were deleted outright rather than kept excluded --
  # each was verified unreferenced by any template, stylesheet, data file, or
  # content file, and the owner asked for exactly this cleanup.

  # Dead font formats. .eot is IE-only and SVG fonts are obsolete; every
  # browser since ~2012 takes .woff, which is what main.css asks for.
  - fonts/*.eot
  - fonts/*.svg
  - fonts/*.ttf

  # Weights and styles of the three chosen families that main.css never
  # declares an @font-face for. A browser therefore never requests them, so
  # this does not change page weight -- it keeps 231KB of dead bytes out of the
  # deploy. Unblocked now that the typefaces are settled. If you ever want real
  # bold body copy instead of the synthetic bold <strong> currently gets,
  # Vollkorn-Bold is the file to bring back, and it needs an @font-face rule as
  # well as removing from this list.
  #
  # Vollkorn-Bold IS now back -- it has an @font-face and the intro's jump link
  # uses it. 28KB, and it means bold body text is a real weight rather than one
  # the browser smears on.
  - fonts/Crimson-Italic-webfont.woff
  - fonts/Crimson-BoldItalic-webfont.woff
  - fonts/Crimson-Semibold-webfont.woff
  - fonts/Crimson-SemiboldItalic-webfont.woff
  - fonts/Vollkorn-BoldItalic-webfont.woff

  # Font families the redesign does not use. main.css loads exactly five
  # files: League Gothic, Crimson Roman + Bold, Vollkorn Regular + Italic.
  - fonts/Chunkfive-webfont.woff
  - fonts/ColabBol-webfont.woff
  - fonts/ColabLig-webfont.woff
  - fonts/ColabReg-webfont.woff
  - fonts/ColabThi-webfont.woff
  - fonts/Melbourne_reg.woff
  - fonts/gil_____-webfont.woff
  - fonts/gilb____-webfont.woff
  - fonts/gillsans-webfont.woff

